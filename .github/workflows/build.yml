name: Build Windows exe + Android APK

on:
  push:
  workflow_dispatch:   # also lets you start a build by hand: Actions tab > Build Windows exe + Android APK > Run workflow

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The platform folders (windows/, android/) are generated by tool/setup.ps1.
      # If you have committed them, the setup is skipped.
      - name: Generate platform folders (only if windows/ is not in the repo)
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            ./tool/setup.ps1
          } else {
            Write-Host 'windows/ is already in the repo, skipping tool/setup.ps1'
          }

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # Upload the whole Release folder: free_llm_chat.exe needs the DLLs and data/ next to it.
      - name: Upload the Release folder
        uses: actions/upload-artifact@v7
        with:
          name: free_llm_chat-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-android:
    # Runs on Windows too, because tool/setup.ps1 is written for Windows PowerShell paths.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds the INTERNET permission, usesCleartextTraffic and minSdk 23 (see tool/setup.ps1).
      - name: Generate platform folders (only if android/ is not in the repo)
        shell: pwsh
        run: |
          if (-not (Test-Path android)) {
            ./tool/setup.ps1
          } else {
            Write-Host 'android/ is already in the repo, skipping tool/setup.ps1'
          }

      - name: Get packages
        run: flutter pub get

      # Signed with the debug key (fine for sideloading), same as `flutter build apk --release` locally.
      - name: Build APK release
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: free_llm_chat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
